{% extends "base.html" %}
{#{% load crispy_forms_filters %}#}

{% block content %}
  <h1>
    Tags
{#    <a class="btn btn-primary" href="{% url 'plans:teg-create' %}">Add</a>#}
  </h1>
  {% if teg_list %}
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
      {% for teg in teg_list %}
        <tr>
          <td>{{ teg.name }}</td>
          <td>
            <a href="#">Update</a>
          </td>
          <td>
            <a href="#">Delete</a>
          </td>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
